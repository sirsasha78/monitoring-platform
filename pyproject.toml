[project]
name = "monitoring-platform"
version = "0.1.0"
description = "Платформа для мониторинга статуса внешних сервисов"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    "bcrypt>=5.0.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "mypy>=1.13.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 98
target-version = "py314"
fix = true
extend-exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
    "migrations", 
]

[tool.ruff.lint]
select = [
    "E",   
    "W",   
    "F",   
    "I",   
    "N",   
    "UP",  
    "B",   
    "C4",  
    "SIM", 
    "RUF", 
]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"app/modules/**/models.py" = ["UP037"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "migrations.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]